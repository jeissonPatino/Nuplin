<div id="extralargeModal" 
    class="fixed inset-0 z-[9999] flex items-center justify-center bg-black bg-opacity-50 px-4 sm:px-6">
    <div class="ti-modal-box lg:!max-w-4xl lg:w-full m-3 lg:!mx-auto
                bg-white rounded-lg shadow-lg transition-all transform scale-100">
        <div class="ti-modal-content p-6">
            <div class="ti-modal-header flex justify-between items-center border-b pb-3">
                <h6 class="ti-modal-title">{{ title }}</h6>
                <button type="button" class="ti-modal-close-btn" (click)="handleClose()">
                    <i class="ri-close-line text-xl"></i>
                </button>
            </div>
            <div class="ti-modal-body p-4 sm:p-6 lg:!max-w-4xl lg:w-full m-3 lg:!mx-auto">
                <ng-content></ng-content> <!-- Contenido dinámico -->
            </div>
            <div class="ti-modal-footer flex justify-end gap-2 mt-4 border-t pt-3">
                <button (click)="handleClose()" class=" ti-btn ti-btn-lg ti-btn-soft-danger rounded-md">Cancelar</button>
                <button (click)="handleSave()" class=" ti-btn ti-btn-lg ti-btn-soft-success rounded-md">Guardar</button>
            </div>
        </div>
    </div>
</div>
