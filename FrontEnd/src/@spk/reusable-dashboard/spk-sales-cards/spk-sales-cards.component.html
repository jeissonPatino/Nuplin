<div *ngIf="card.rol === userRole" [routerLink]="[card.route]" class="box {{card.cardClass}}">
  <div class="box-body">
      <div  class="flex items-start justify-between {{card.customClass}}">
        <div class="{{card.customClass1}}">
          <ng-container *ngIf="card.titleClass; else defaultTitle">
            <span class="text-textmuted dark:text-textmuted/50 block mb-1 {{card.titleClass}}">
              {{card.title}}
            </span>
          </ng-container>
          <ng-template #defaultTitle>
            <p class="text-muted fw-medium mb-2">{{card.title}}</p>
          </ng-template>
          <h4 class="{{card.valueClass}}">{{card.value}}</h4>
        </div>
        <div class="leading-none">
          <ng-container *ngIf="card.icon; else svgIcon">
            <span class="avatar avatar-md avatar-rounded bg-{{card.bg}}">
              <i class="{{card.icon}} text-[1.25rem]"></i>
            </span>
          </ng-container>
          <ng-template #svgIcon>
            <span class="{{card.svgClass}}">
              <div [innerHTML]="sanitizeIcon(card.svg)"></div>
            </span>
          </ng-template>
        </div>
      </div>
      <div class="text-textmuted dark:text-textmuted/50 text-[13px]">{{card.graph}}  <span class="text-{{card.color}}">{{card.percentage}}<i [class]="card.percentageIcon"></i></span></div>
  </div>
</div>
