<div class="container mx-auto p-4">
    <h2 class="text-2xl font-bold mb-4">Registro de Actividad del Usuario</h2>
  
    <div *ngIf="loading" class="text-center">Cargando registros...</div>
  
    <div *ngIf="error" class="text-red-500 text-center">{{ error }}</div>
  
    <div *ngIf="logs.length > 0 && !loading && !error">
        <div class="flex justify-end mb-4">
            <button class="ti-btn ti-btn-sm ti-btn-info ml-2" (click)="updateExportData()">
              Exportar a Excel
            </button>
          </div>
      <spk-reusable-tables
        [columns]="responsiveColumn"
        tableHeadColumn="text-start"
        tableClass="ti-custom-table whitespace-nowrap min-w-full"
        trClass="border-b border-defaultborder dark:border-defaultborder/10"
        [showCheckbox]="false"
      >
        <ng-container *ngFor="let log of paginatedData; track $index">
          <tr>
            <td>{{ log.emialUsuario }}</td>
            <td>{{ log.mensaje }}</td>
          </tr>
        </ng-container>
      </spk-reusable-tables>
  
      <div class="flex justify-center mt-4" *ngIf="totalPages() > 1">
        <nav class="flex items-center gap-x-2">
          <button
            type="button"
            (click)="changePage(currentPage - 1)"
            [disabled]="currentPage === 1"
            class="min-h-[38px] min-w-[38px] flex justify-center items-center text-gray-500 hover:text-blue-600 disabled:opacity-50"
          >
            <i class="ri-arrow-left-s-line text-lg"></i>
          </button>
  
          <div class="flex items-center gap-x-2">
            <button
              type="button"
              (click)="changePage(page)"
              [class.border-blue-500]="page === currentPage"
              [class.text-blue-600]="page === currentPage"
              [class.bg-blue-100]="page === currentPage"
              class="min-h-[38px] min-w-[38px] flex justify-center items-center border border-gray-300 rounded-lg text-gray-700 hover:border-blue-500 hover:text-blue-600 transition-all"
              *ngFor="let page of totalPagesArray; track $index"
            >
              {{ page }}
            </button>
          </div>
  
          <button
            type="button"
            (click)="changePage(currentPage + 1)"
            [disabled]="currentPage === totalPages()"
            class="min-h-[38px] min-w-[38px] flex justify-center items-center text-gray-500 hover:text-blue-600 disabled:opacity-50"
          >
            <i class="ri-arrow-right-s-line text-lg"></i>
          </button>
        </nav>
      </div>
    </div>
  
    <div *ngIf="logs.length === 0 && !loading && !error" class="text-center mt-4">No hay registros disponibles.</div>
  </div>
