<!-- Start::page-header -->
<div class="flex items-center justify-between page-header-breadcrumb flex-wrap gap-2">
    <div>
        <h1 class="page-title font-medium text-lg mb-0">Inicio</h1>
    </div>
</div>
<!-- End::page-header -->
 <!-- Start::Table Usuarios -->
    <div class="grid grid-cols-12 gap-6">
        <div class="xl:col-span-12 col-span-12">
            <div class="box overflow-hidden">
                <div class="box-header justify-between">
                    <div class="box-title">
                        USUARIOS
                    </div>
                    <button class="ti-btn ti-btn-icon ti-btn-sm ti-btn-soft-success" (click)="openCreateModal()">
                        <i class="ri-user-add-line"></i>
                    </button>
                </div>
                <div class="box-body">
                    <div class="box-body space-y-3">
                        <div class="form-group">
                            <div class="input-group">
                                <div class="input-group-text !text-textmuted dark:text-textmuted/50 !border-defaultborder dark:!border-defaultborder/10"> <i class="ri-calendar-line"></i> </div>
                                <spk-flatpickr 
                                    [placeholder]="'Selecciona un rango de fechas'" 
                                    [mode]="'range'"
                                    [altInput]="true"
                                    [dateFormat]="'Y-m-d'"
                                    [enableTime]="false"
                                    class="form-control text-dark custom-datepickr">
                                </spk-flatpickr>
                            </div>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <spk-reusable-tables [columns]="responsiveColumn"  tableHeadColumn="text-start"
                        trClass="border-b  border-defaultborder dark:border-defaultborder/10"
                        tableClass="ti-custom-table whitespace-nowrap min-w-full"  [showCheckbox]="false">
        
                            @for(table of responsiveTables;track $index){
                            <tr>
                                <th scope="row"><input class="form-check-input" type="checkbox" id="checkboxNoLabel1" value=""
                                        aria-label="..."></th>
                                <td>
                                    <div class="flex items-center">
                                        <span class="avatar avatar-xs me-2 online avatar-rounded">
                                            <img [src]="table.src" alt="img">
                                        </span>{{table.name}}
                                    </div>
                                </td>
                                <td>{{table.category}}</td>
                                <td><span class="badge bg-{{table.bg}}-transparent">{{table.role}}</span></td>
                                <td>{{table.mail}}</td>
                                <td>
                                    <div class="avatar-list-stacked">
                                        @for(image of table.images;track $index){
                                        <span class="avatar avatar-sm avatar-rounded">
                                            <img [src]="image" alt="img">
                                        </span>
                                        }
        
                                        <a class="avatar avatar-sm bg-primary text-white avatar-rounded"
                                            href="javascript:void(0);">
                                            +{{table.count}}
                                        </a>
                                    </div>
                                </td>
                                <td>
                                    <div class="progress progress-xs">
                                        <div class="progress-bar bg-primary" role="progressbar" [style.width.%]="table.progress"
                                            aria-valuenow="52" aria-valuemin="0" aria-valuemax="100">
                                        </div>
                                    </div>
                                </td>
                                <td>{{table.revenue}}</td>
                                <td>
                                    <div class="hstack flex gap-3 text-[.9375rem]">
                                        <a class="ti-btn ti-btn-icon ti-btn-sm ti-btn-soft-info" (click)="openEditModal(table)"><i
                                                class="ri-edit-line"></i></a>
                                        <a href="javascript:void(0);"
                                            class="ti-btn ti-btn-sm ti-btn-soft-danger !rounded-full"><i
                                                class="ri-delete-bin-line"></i></a>
                                    </div>
                                </td>
                            </tr>
                            }
                        </spk-reusable-tables>
                    </div>
                </div>
            </div>
            <!-- Pagination -->
            <div class="flex justify-center mt-4">
                <nav class="flex items-center gap-x-1 ">
                    <button type="button"
                        class="min-h-[38px] min-w-[38px] py-2 px-2.5 inline-flex justify-center items-center gap-x-2 text-sm rounded-md border border-transparent text-gray-800 hover:bg-gray-100 focus:outline-none focus:bg-gray-100 disabled:opacity-50 disabled:pointer-events-none dark:border-transparent dark:text-white dark:hover:bg-white/10 dark:focus:bg-white/10">
                        <i class="ri-arrow-left-s-line align-middle rtl:rotate-180"></i>
                        <span aria-hidden="true" class="sr-only">Previous</span>
                    </button>
                    <div class="flex items-center gap-x-1">
                        <button type="button"
                            class="min-h-[38px] min-w-[38px] flex justify-center items-center border border-primary text-primary py-2 px-3 text-sm rounded-md focus:outline-none focus:bg-gray-50 disabled:opacity-50 disabled:pointer-events-none dark:border-primary dark:text-primary dark:focus:bg-white/10"
                            aria-current="page">1</button>
                        <div class="hs-tooltip ti-main-tooltip">
                            <button type="button"
                                class="hs-tooltip-toggle group min-h-[38px] min-w-[38px] flex justify-center items-center text-gray-400 hover:text-primary p-2 text-sm rounded-md focus:outline-none focus:bg-gray-100 disabled:opacity-50 disabled:pointer-events-none dark:text-white dark:hover:text-primary dark:focus:bg-white/10">
                                <span class="group-hover:hidden text-xs">•••</span>
                                <svg class="group-hover:block hidden flex-shrink-0 size-5"
                                    xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="m6 17 5-5-5-5" />
                                    <path d="m13 17 5-5-5-5" />
                                </svg>
                                <span
                                    class="hs-tooltip-content ti-main-tooltip-content py-1 px-2 bg-gray-900 text-xs font-medium text-white shadow-sm dark:bg-bodybg"
                                    role="tooltip">
                                    Next 4 pages
                                </span>
                            </button>
                        </div>
                        <button type="button"
                            class="min-h-[38px] min-w-[38px] flex justify-center items-center border border-transparent text-gray-800 hover:bg-gray-100 py-2 px-3 text-sm rounded-md focus:outline-none focus:bg-gray-100 disabled:opacity-50 disabled:pointer-events-none dark:border-transparent dark:text-white dark:hover:bg-white/10 dark:focus:bg-white/10">8</button>
                    </div>
                    <button type="button"
                        class="min-h-[38px] min-w-[38px] py-2 px-2.5 inline-flex justify-center items-center gap-x-2 text-sm rounded-md border border-transparent text-gray-800 hover:bg-gray-100 focus:outline-none focus:bg-gray-100 disabled:opacity-50 disabled:pointer-events-none dark:border-transparent dark:text-white dark:hover:bg-white/10 dark:focus:bg-white/10">
                        <span aria-hidden="true" class="sr-only">Next</span>
                        <i class="ri-arrow-right-s-line align-middle rtl:rotate-180"></i>
                    </button>
                </nav>
            </div>
        <!-- End Pagination -->
        </div>
    </div>
    <!-- End:: Table Usuarios -->

<app-modal-usuarios 
    *ngIf="showModal"
    [title]="isEditing ? 'Editar Usuario' : 'Crear Usuario'"
    [data]="selectedUser"
    (closeModal)="closeModal()"
    (onSave)="handleSave($event)">
        <div>
            <label class="block text-sm">Nombre</label>
            <input type="text" [(ngModel)]="selectedUser.name" class="w-full border p-2 rounded" />
            <label class="block text-sm mt-2">Correo</label>
            <input type="email" [(ngModel)]="selectedUser.mail" class="w-full border p-2 rounded" />
        </div>
</app-modal-usuarios>
