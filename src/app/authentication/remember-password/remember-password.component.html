<div class="container">
    <div class="grid grid-cols-12 justify-center items-center authentication authentication-basic h-full">
        <div class="xxl:col-span-4 xl:col-span-4 lg:col-span-3 md:col-span-3 sm:col-span-2 col-span-12"></div>
        <div class="xxl:col-span-4 xl:col-span-4 lg:col-span-6 md:col-span-6 sm:col-span-8 col-span-12 px-3">
            <div class="box my-4">
                <div class="box-body p-[3rem]">
                    <div class="mb-3 flex justify-center">
                        <img src="./assets/images/company-logos/1 NUPLIN-NEGATIVO-PARA-CLARO-109x31.png" alt="logo" class="desktop-logo">
                        <img src="./assets/images/company-logos/2 NUPLIN-POSITIVO PARA OSCURO-109x31.png" alt="logo" class="desktop-white">
                    </div>
                    <p class="h5 mb-2 text-center">Cambiar contraseña</p>
                    <form [formGroup]="resetPass" (ngSubmit)="Submit()" >
                        <div class="grid grid-cols-12 gap-y-4">
                            <div class="xl:col-span-12 col-span-12">
                                <div class="relative">
                                    <label for="signup-firstname" class="ti-form-label text-default">Correo<sup class="text-xs text-danger">*</sup></label>
                                    <input type="email" class="form-control" id="signup-firstname" placeholder="Correo" autocomplete formControlName="username" required (change)="validateUser()">
                                </div>
                            </div>
                            <div class="xl:col-span-12 col-span-12">
                                <label for="reset-newpassword" class="form-label text-defaulttextcolor">Nueva contraseña<sup class="text-xs text-danger">*</sup> </label>
                                <div class="relative">
                                    <input  
                                        [type]="showPassword1 ? 'text' : 'password'" 
                                        type="password" 
                                        class="form-control create-password-input"  
                                        id="reset-newpassword" 
                                        placeholder="Nueva contraseña " 
                                        formControlName="newPass" 
                                        required 
                                    >
                                    <a href="javascript:void(0);" class="show-password-button text-textmuted dark:text-textmuted/50" (click)="togglePassword1()" id="button-addon21"><i class="{{toggleClass1}} align-middle"></i></a>
                                </div>
                                <ul class="mt-2 text-sm">
                                    <li [ngClass]="{'text-green-500': validaciones.longitud, 'text-red-500': !validaciones.longitud}">
                                      🔹 Mínimo 8 y máximo 12 caracteres
                                    </li>
                                    <li [ngClass]="{'text-green-500': validaciones.mayuscula, 'text-red-500': !validaciones.mayuscula}">
                                      🔹 Al menos una mayúscula
                                    </li>
                                    <li [ngClass]="{'text-green-500': validaciones.numero, 'text-red-500': !validaciones.numero}">
                                      🔹 Al menos un número
                                    </li>
                                    <li [ngClass]="{'text-green-500': validaciones.especial, 'text-red-500': !validaciones.especial}">
                                      🔹 Al menos un carácter especial
                                    </li>
                                  </ul>
                                <span class="float-end">
                                    <a (click)="generarPassword()" class="ti-btn ti-btn-primary">
                                      Suguerir contraseña
                                    </a>
                                  </span>
                            </div>
                            <div class="xl:col-span-12 col-span-12 mb-2">
                                <label for="reset-confirmpassword" class="form-label text-defaulttextcolor">Confirmar contraseña<sup class="text-xs text-danger">*</sup></label>
                                <div class="relative">
                                    <input  
                                        [type]="showPassword2 ? 'text' : 'password'" 
                                        type="password" 
                                        class="form-control create-password-input" 
                                        id="reset-confirmpassword" 
                                        placeholder="Confirmar contraseña" 
                                        formControlName="confPass" 
                                        (keydown)="preventPaste($event)" 
                                        (paste)="preventPaste($event)" 
                                        (contextmenu)="preventPaste($event)" 
                                        required
                                    >
                                    <a href="javascript:void(0);" class="show-password-button text-textmuted dark:text-textmuted/50" (click)="togglePassword2()" id="button-addon22"><i class="{{toggleClass2}} align-middle"></i></a>
                                </div>
                            </div>
                        </div>
                        <div class="grid mt-4" >
                            <button 
                                [disabled]="!resetPass.valid && userExists && userActive" 
                                class="ti-btn ti-btn-primary"
                            >
                                    Verificar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="xxl:col-span-4 xl:col-span-4 lg:col-span-3 md:col-span-3 sm:col-span-2 col-span-12"></div>
    </div>
</div>
